<section class="admin-gala-wrapper">
  <div class="dots-background"></div>

  <div class="container py-5">
    <div class="master-card-gala shadow">
      <div class="gala-header">
        <div class="header-visual">
          <img src="assets-webp/entrada.webp" alt="Registro" class="header-main-icon" />
          <div class="header-text">
            <h1>Alta de <span class="highlight">Usuarios</span></h1>
          </div>
        </div>
        <div class="header-gold-bar"></div>
      </div>

      <div class="gala-content p-4 p-md-5">
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
          <div class="setup-section mb-5">
            <h5 class="section-label">Selecciona el Perfil</h5>
            <div class="role-selector-grid">
              <label class="role-card" [class.active]="tipoSeleccionado === 'ADMIN'">
                <input
                  type="radio"
                  formControlName="tipo"
                  value="ADMIN"
                  (change)="onTipoChange()"
                />
                <div class="role-card-inner">
                  <img src="assets-webp/entrada.webp" alt="Admin" />
                  <span>Administrador</span>
                </div>
              </label>

              <label class="role-card" [class.active]="tipoSeleccionado === 'AYUNTAMIENTO'">
                <input
                  type="radio"
                  formControlName="tipo"
                  value="AYUNTAMIENTO"
                  (change)="onTipoChange()"
                />
                <div class="role-card-inner">
                  <img src="assets-webp/ayuntamiento.webp" alt="Ayto" />
                  <span>Ayuntamiento</span>
                </div>
              </label>

              <label class="role-card" [class.active]="tipoSeleccionado === 'CASETA'">
                <input
                  type="radio"
                  formControlName="tipo"
                  value="CASETA"
                  (change)="onTipoChange()"
                />
                <div class="role-card-inner">
                  <img src="assets-webp/caseta.webp" alt="Caseta" />
                  <span>Caseta</span>
                </div>
              </label>

              <label class="role-card" [class.active]="tipoSeleccionado === 'SOCIO'">
                <input
                  type="radio"
                  formControlName="tipo"
                  value="SOCIO"
                  (change)="onTipoChange()"
                />
                <div class="role-card-inner">
                  <img src="assets-webp/socio-naranja.webp" alt="Socio" />
                  <span>Socio</span>
                </div>
              </label>
            </div>
          </div>

          <div class="sections-stack" *ngIf="tipoSeleccionado">
            <div class="gala-info-card">
              <div class="block-title">
                <img src="assets-webp/flamenca.webp" alt="" />
                <h4>Información de Contacto</h4>
              </div>
              <div class="row g-4">
                <div class="col-md-6">
                  <div class="gala-input-group">
                    <label>Nombre</label>
                    <input type="text" formControlName="nombre" placeholder="Nombre completo" />
                  </div>
                </div>
                <div class="col-md-6" *ngIf="mostrarApellidos()">
                  <div class="gala-input-group">
                    <label>Primer Apellido</label>
                    <input type="text" formControlName="primerApellido" placeholder="Apellido" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="gala-input-group">
                    <label>Email Corporativo</label>
                    <input type="email" formControlName="correo" placeholder="correo@ejemplo.com" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="gala-input-group">
                    <label>Teléfono</label>
                    <input type="text" formControlName="telefono" placeholder="600 000 000" />
                  </div>
                </div>
              </div>
            </div>

            <div class="gala-info-card special-card" *ngIf="tipoSeleccionado !== 'ADMIN'">
              <div class="block-title">
                <img src="assets-webp/castañuelas.webp" alt="" />
                <h4>Detalles Específicos</h4>
              </div>

              <div class="row" *ngIf="tipoSeleccionado === 'SOCIO'">
                <div class="col-md-6">
                  <div class="gala-input-group">
                    <label>Fecha de Incorporación</label>
                    <input type="date" formControlName="fechaAlta" class="gala-datepicker" />
                  </div>
                </div>
              </div>

              <div class="row g-4" *ngIf="tipoSeleccionado === 'CASETA'">
                <div class="col-md-8">
                  <div class="gala-input-group">
                    <label>Razón Social</label>
                    <input type="text" formControlName="razonS" />
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="gala-input-group">
                    <label>Aforo Máximo</label>
                    <input type="number" formControlName="aforo" />
                  </div>
                </div>
              </div>

              <div class="row" *ngIf="tipoSeleccionado === 'AYUNTAMIENTO'">
                <div class="col-md-6">
                  <div class="gala-input-group">
                    <label>Cupo de Licencias</label>
                    <input type="number" formControlName="licenciaMax" />
                  </div>
                </div>
              </div>
            </div>

            <div class="gala-info-card">
              <div class="block-title">
                <img src="assets-webp/peineta.webp" alt="" />
                <h4>Seguridad y Acceso</h4>
              </div>
              <div class="row g-4">
                <div class="col-md-6">
                  <div class="gala-input-group">
                    <label>Usuario</label>
                    <input type="text" formControlName="username" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="gala-input-group">
                    <label>Contraseña Temporal</label>
                    <input type="password" formControlName="password" placeholder="••••••••" />
                  </div>
                </div>
              </div>
            </div>

            <div class="gala-actions">
              <button type="button" class="btn-cancel" routerLink="/administradores">
                Cancelar
              </button>
              <button type="submit" class="btn-submit" [disabled]="userForm.invalid && submitted">
                Confirmar Alta
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
