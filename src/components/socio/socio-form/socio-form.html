<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">{{ id == null ? 'Registro de Socio' : 'Editar Datos Personales' }}</h3>
    </div>
    
    <div class="card-body">
      <form [formGroup]="formularioSocio" (ngSubmit)="onSubmit()">
        
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Nombre *</label>
            <input type="text" formControlName="nombre" class="form-control"
                   [class.is-invalid]="esInvalido('nombre')">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Primer Apellido *</label>
            <input type="text" formControlName="primerApellido" class="form-control"
                   [class.is-invalid]="esInvalido('primerApellido')">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Segundo Apellido (Opcional)</label>
            <input type="text" formControlName="segundoApellido" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Correo Electrónico *</label>
            <input type="email" formControlName="correo" class="form-control"
                   [class.is-invalid]="esInvalido('correo')">
            <div class="invalid-feedback">Debe introducir un email válido.</div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Teléfono * (9 dígitos)</label>
            <input type="text" formControlName="telefono" class="form-control"
                   [class.is-invalid]="esInvalido('telefono')">
            <div class="invalid-feedback">Debe empezar por 6, 7, 8 o 9 y tener 9 números.</div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12 mb-3">
            <label class="form-label">URL de la Foto (Opcional)</label>
            <input type="text" formControlName="foto" class="form-control"
                   [class.is-invalid]="esInvalido('foto')" placeholder="https://ejemplo.com/mi-foto.jpg">
            <div class="invalid-feedback">Debe ser una URL válida (http/https).</div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombre de Usuario *</label>
            <input type="text" formControlName="username" class="form-control"
                   [class.is-invalid]="esInvalido('username')">
          </div>

          <div class="col-md-6 mb-3" *ngIf="id == null">
            <label class="form-label">Contraseña *</label>
            <input type="password" formControlName="password" class="form-control"
                   [class.is-invalid]="esInvalido('password')">
            <div class="invalid-feedback">Mínimo 6 caracteres.</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Dirección (Opcional)</label>
          <input type="text" formControlName="direccion" class="form-control">
        </div>

        <div class="text-end mt-4">
          <button type="submit" class="btn btn-success" [disabled]="formularioSocio.invalid">
            {{ id == null ? 'Registrar Socio' : 'Guardar Cambios' }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
