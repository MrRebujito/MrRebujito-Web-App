<div class="container mt-4">
  <h2 class="mb-4">Tabla de Socios</h2>

  <div class="table-responsive">
    <table class="table table-striped table-hover table-bordered">
      <thead class="table-dark">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Nombre</th>
          <th scope="col">Dirección</th>
          <th scope="col">Email</th>
          <th scope="col">Username</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of socios">
          <td>{{ s.id }}</td>
          <td>{{ s.nombre }} {{ s.primerApellido }} {{ s.segundoApellido || '' }}</td>
          <td>{{ s.direccion || 'No indicada' }}</td>
          <td>
            <div><i class="bi bi-envelope"></i> {{ s.correo }}</div>
            <div *ngIf="s.telefono"><i class="bi bi-telephone"></i> {{ s.telefono }}</div>
          </td>
          <td class="text-center">{{ s.username }}</td>
          <td class="text-center align-middle">
            <button class="btn btn-info btn-sm" [routerLink]="['/socio/', s.id]">
              <i class="bi bi-eye"></i> Ver
            </button>
          </td>
        </tr>
        <tr *ngIf="socios.length === 0">
          <td colspan="6" class="text-center">No hay socios registrados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
