<div class="container mt-4">
  <h2 class="mb-4">Tabla de Socios</h2>

  <div class="table-responsive">
    <table class="table table-striped table-hover table-bordered">
      <thead class="table-dark">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Nombre</th>
          <th scope="col">Dirección</th>
          <th scope="col">Email</th>
          <th scope="col">Username</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of socios">
          <td>{{ s.id }}</td>
          <td>{{ s.nombre }} {{ s.primerApellido }} {{ s.segundoApellido || '' }}</td>
          <td>{{ s.direccion || 'No indicada' }}</td>
          <td>
            <div><i class="bi bi-envelope"></i> {{ s.correo }}</div>
            <div *ngIf="s.telefono"><i class="bi bi-telephone"></i> {{ s.telefono }}</div>
          </td>
          <td class="text-center">{{ s.username }}</td>
          <td class="text-center align-middle">
            <div class="btn-group" role="group">
              <button class="btn btn-info btn-sm" [routerLink]="['/socios', s.id]" title="Ver detalles">
                <i class="bi bi-eye"></i>
              </button>
              
              <button class="btn btn-warning btn-sm" [routerLink]="['/socios/editar', s.id]" title="Editar socio">
                <i class="bi bi-pencil text-white"></i>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="socios.length === 0">
          <td colspan="6" class="text-center">No hay socios registrados</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-3 text-end">
    <button class="btn btn-success" [routerLink]="['/socios/nuevo']">
      <i class="bi bi-person-plus-fill"></i> Registrar Nuevo Socio
    </button>
  </div>
</div>
