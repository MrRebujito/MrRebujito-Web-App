<div class="container mt-4">
  <h2>Solicitudes de Licencia</h2>

  <!-- Filtros -->
  <div class="row mb-3">
    <div class="col-md-4">
      <label class="form-label">Estado:</label>
      <select class="form-select" [(ngModel)]="filtroEstado">
        <option value="">Todos</option>
        <option value="PENDIENTE">Pendiente</option>
        <option value="APROBADA">Aprobada</option>
        <option value="RECHAZADA">Rechazada</option>
      </select>
    </div>
    
    <div class="col-md-4">
      <label class="form-label">Ayuntamiento:</label>
      <select class="form-select" [(ngModel)]="filtroAyuntamiento">
        <option value="">Todos</option>
        <option *ngFor="let ayto of ayuntamientos" [value]="ayto">
          {{ ayto }}
        </option>
      </select>
    </div>
    
    <div class="col-md-4 d-flex align-items-end">
      <button class="btn btn-primary me-2" (click)="aplicarFiltros()">Filtrar</button>
      <button class="btn btn-secondary" (click)="limpiarFiltros()">Limpiar</button>
    </div>
  </div>

  <!-- Tabla -->
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Estado</th>
        <th>Ayuntamiento</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let solicitud of solicitudesFiltradas">
        <td>{{ solicitud.id }}</td>
        <td>
          <span [class]="'badge ' + getBadgeClass(solicitud.estadoLicencia)">
            {{ solicitud.estadoLicencia }}
          </span>
        </td>
        <td>{{ solicitud.ayuntamiento }}</td>
      </tr>
      <tr *ngIf="solicitudesFiltradas.length === 0">
        <td colspan="3" class="text-center">No hay solicitudes</td>
      </tr>
    </tbody>
  </table>
</div>
