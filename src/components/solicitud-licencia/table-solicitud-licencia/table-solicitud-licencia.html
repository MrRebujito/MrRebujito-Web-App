<div class="container mt-4">
  <h2>Solicitudes de Licencia</h2>

  <!-- Filtros -->
  <div class="row mb-3">
    <div class="col-md-4">
      <label class="form-label">Estado:</label>
      <select class="form-select" [(ngModel)]="filtroEstado">
        <option value="">Todos</option>
        <option value="PENDIENTE">Pendiente</option>
        <option value="APROBADA">Aprobada</option>
        <option value="RECHAZADA">Rechazada</option>
      </select>
    </div>
    
    <div class="col-md-4">
      <label class="form-label">Ayuntamiento:</label>
      <select class="form-select" [(ngModel)]="filtroAyuntamiento">
        <option value="">Todos</option>
        <option *ngFor="let ayto of ayuntamientos" [value]="ayto">
          {{ ayto }}
        </option>
      </select>
    </div>
    
    <div class="col-md-4 d-flex align-items-end">
      <button class="btn btn-primary me-2" (click)="aplicarFiltros()">
        <i class="bi bi-funnel"></i> Filtrar
      </button>
      <button class="btn btn-secondary" (click)="limpiarFiltros()">
        <i class="bi bi-x-circle"></i> Limpiar
      </button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Estado</th>
          <th>Ayuntamiento</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let solicitud of solicitudesFiltradas">
          <td>{{ solicitud.id }}</td>
          <td>
            <span [class]="'badge ' + getBadgeClass(solicitud.estadoLicencia)">
              {{ solicitud.estadoLicencia }}
            </span>
          </td>
          <td>{{ getNombreAyuntamiento(solicitud) }}</td>
          <td>
            <button class="btn btn-sm btn-info me-1" title="Ver detalles">
              <i class="bi bi-eye"></i>
            </button>
            <button class="btn btn-sm btn-warning me-1" title="Editar">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-danger" title="Eliminar">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="solicitudesFiltradas.length === 0">
          <td colspan="4" class="text-center text-muted">
            <i class="bi bi-inbox"></i> No hay solicitudes
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Información adicional -->
  <div class="mt-3">
    <small class="text-muted">
      Mostrando {{ solicitudesFiltradas.length }} de {{ solicitudes.length }} solicitudes
    </small>
  </div>
</div>
