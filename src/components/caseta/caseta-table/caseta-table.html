<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Casetas</h2>

    <button class="btn btn-success" [routerLink]="['/casetas/nuevo']" title="Nueva Caseta">
      <span style="font-size: 1.8rem; line-height: 0; margin-bottom: 4px; margin-right: 8px"
        >+</span
      >
      <img
        src="/assets-webp/caseta.webp"
        alt="Icono Caseta"
        style="height: 30px; width: auto; filter: brightness(0) invert(1)"
      />
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr>
          <th scope="col" class="text-center">ID</th>
          <th scope="col">Razón Social</th>
          <th scope="col">Ubicación</th>
          <th scope="col" class="text-center">Aforo</th>
          <th scope="col" class="text-center">Tipo</th>
          <th scope="col" class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let caseta of casetas">
          <td class="text-center fw-bold" style="color: var(--mr-primary)">{{ caseta.id }}</td>

          <td style="font-family: 'Merriweather', serif; font-weight: 700; color: var(--mr-accent)">
            {{ caseta.razonS }}
          </td>

          <td>{{ caseta.direccion || 'No especificada' }}</td>

          <td class="text-center">{{ caseta.aforo }}</td>

          <td class="text-center">
            <span class="badge" [ngClass]="caseta.publica ? 'bg-primary' : 'bg-secondary'">
              {{ caseta.publica ? 'Pública' : 'Privada' }}
            </span>
          </td>

          <td class="text-center align-middle">
            <div class="btn-group" role="group">
              <button
                class="btn btn-info btn-sm me-1"
                [routerLink]="['/casetas', caseta.id]"
                title="Ver detalles"
              >
                <i class="bi bi-eye"></i>
              </button>

              <button
                class="btn btn-warning btn-sm me-1"
                [routerLink]="['/casetas/editar', caseta.id]"
                title="Editar caseta"
              >
                <i class="bi bi-pencil text-white"></i>
              </button>

              <button
                class="btn btn-primary btn-sm"
                [routerLink]="['/casetas', caseta.id, 'socios']"
                title="Gestionar socios"
              >
                <i class="bi bi-people-fill text-white"></i>
              </button>
            </div>
          </td>
        </tr>

        <tr *ngIf="casetas.length === 0">
          <td colspan="6" class="text-center py-5 text-muted fst-italic">
            <i class="bi bi-shop me-2" style="font-size: 1.5rem"></i> No hay casetas registradas en
            el sistema.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
