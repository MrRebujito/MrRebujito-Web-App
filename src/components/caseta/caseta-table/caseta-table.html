<div class="container mt-4">
  <h2 class="mb-4">Gestión de Casetas</h2>

  <!-- Botón para crear nueva caseta -->
  <div class="mb-3 text-end">
    <button class="btn btn-success" [routerLink]="['/casetas/nuevo']">
      <i class="bi bi-plus-circle"></i> Nueva Caseta
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover table-bordered">
      <thead class="table-dark">
        <tr>
          <th scope="col">Número</th>
          <th scope="col">Razón Social</th>
          <th scope="col">Ubicación</th>
          <th scope="col">Aforo</th>
          <th scope="col">Estado</th>
          <th scope="col">Tipo</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let caseta of casetas">
          <td>{{ caseta.razonS }}</td>
          <td>{{ caseta.direccion || 'No especificada' }}</td>
          <td class="text-center">{{ caseta.aforo }}</td>
          <td>
            <span class="badge" [ngClass]="caseta.publica ? 'bg-primary' : 'bg-secondary'">
              {{ caseta.publica ? 'Pública' : 'Privada' }}
            </span>
          </td>
          <td class="text-center align-middle">
            <div class="btn-group" role="group">
              <button 
                class="btn btn-info btn-sm" 
                [routerLink]="['/casetas', caseta.id]" 
                title="Ver detalles">
                <i class="bi bi-eye"></i>
              </button>
              
              <button 
                class="btn btn-warning btn-sm" 
                [routerLink]="['/casetas/editar', caseta.id]" 
                title="Editar caseta">
                <i class="bi bi-pencil text-white"></i>
              </button>

              <button 
                class="btn btn-primary btn-sm" 
                [routerLink]="['/casetas', caseta.id, 'socios']" 
                title="Gestionar socios">
                <i class="bi bi-people-fill text-white"></i>
              </button>
            </div>
          </td>
        </tr>
        
        <tr *ngIf="casetas.length === 0">
          <td colspan="7" class="text-center">No hay casetas registradas</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
