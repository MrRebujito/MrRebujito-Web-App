<div class="container my-5 d-flex justify-content-center">

    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Iniciar sesión</h3>
                <div *ngIf="loginError" class="alert alert-danger text-center">
                    {{ loginError }}
                </div>
                <form [formGroup]="formLogin" (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" id="username" class="form-control" formControlName="username"
                            placeholder="Introduce tu usuario">
                        <div class="text-danger mt-1"
                            *ngIf="formLogin.get('username')?.touched && formLogin.get('username')?.invalid">
                            <small>El usuario es obligatorio</small>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" formControlName="password"
                            placeholder="Introduce tu contraseña">
                        <div class="text-danger mt-1"
                            *ngIf="formLogin.get('password')?.touched && formLogin.get('password')?.invalid">
                            <small>La contraseña es obligatoria</small>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary" [disabled]="formLogin.invalid">
                            Entrar
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
