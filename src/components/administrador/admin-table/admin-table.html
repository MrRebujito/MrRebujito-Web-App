<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="titulo-seccion">Gestión de Administradores</h2>
  </div>

  <div class="table-responsive shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead>
        <tr>
          <th scope="col" class="text-center">ID</th>
          <th scope="col">Nombre Completo</th>
          <th scope="col">Contacto</th>
          <th scope="col">Usuario</th>
          <th scope="col" class="text-center">Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of administradores" [class.table-danger-mr]="a.baneado">
          <td class="text-center fw-bold text-muted small">{{ a.id }}</td>
          <td class="fw-medium">
            {{ a.nombre }} {{ a.primerApellido }} {{ a.segundoApellido || '' }}
          </td>
          <td>
            <div class="small mb-1"><i class="bi bi-envelope"></i> {{ a.correo }}</div>
            <div class="small" *ngIf="a.telefono">
              <i class="bi bi-telephone"></i> {{ a.telefono }}
            </div>
          </td>
          <td>
            <span class="badge bg-username">{{ a.username }}</span>
          </td>
          <td class="text-center">
            <span class="badge" [ngClass]="a.baneado ? 'bg-danger-mr' : 'bg-success-mr'">
              {{ a.baneado ? 'Baneado' : 'Activo' }}
            </span>
          </td>
        </tr>
        <tr *ngIf="administradores.length === 0">
          <td colspan="5" class="text-center py-5 text-muted">
            <i class="bi bi-shield-exclamation display-4 d-block mb-3 opacity-25"></i>
            <p class="fst-italic">No hay administradores registrados en el sistema.</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
