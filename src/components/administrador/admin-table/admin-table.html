<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><span>Tabla de Administradores</span></h2>

    <button class="btn btn-success" [routerLink]="['/administradores/nuevo']" title="Registrar Nuevo Administrador">
      <span style="font-size: 1.8rem; line-height: 0; margin-bottom: 4px">+</span>
      <i class="bi bi-shield-lock" style="font-size: 1.4rem"></i>
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover table-bordered">
      <thead class="table-dark">
        <tr>
          <th scope="col" class="text-center">ID</th>
          <th scope="col">Nombre Completo</th>
          <th scope="col">Contacto</th>
          <th scope="col">Usuario</th>
          <th scope="col" class="text-center">Estado</th>
          <th scope="col" class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of administradores" [class.table-danger]="a.baneado">
          <td class="text-center fw-bold">{{ a.id }}</td>
          <td>{{ a.nombre }} {{ a.primerApellido }} {{ a.segundoApellido || '' }}</td>
          <td>
            <div><i class="bi bi-envelope"></i> {{ a.correo }}</div>
            <div *ngIf="a.telefono"><i class="bi bi-telephone"></i> {{ a.telefono }}</div>
          </td>
          <td>
            <span class="badge bg-light text-dark border">{{ a.username }}</span>
          </td>
          <td class="text-center align-middle">
            <span class="badge" [ngClass]="a.baneado ? 'bg-danger' : 'bg-success'">
              {{ a.baneado ? 'Baneado' : 'Activo' }}
            </span>
          </td>
          <td class="text-center align-middle">
            <div class="btn-group" role="group">
              <button
                class="btn btn-warning btn-sm"
                [routerLink]="['/administradores/editar', a.id]"
                title="Editar administrador"
              >
                <i class="bi bi-pencil text-white"></i>
              </button>

              <button
                class="btn btn-sm"
                [ngClass]="a.baneado ? 'btn-success' : 'btn-danger'"
                (click)="toggleBaneo(a)"
                [title]="a.baneado ? 'Desbanear' : 'Banear'"
              >
                <i class="bi" [ngClass]="a.baneado ? 'bi-unlock' : 'bi-lock'" style="color: white"></i>
              </button>

              <button
                class="btn btn-outline-danger btn-sm"
                (click)="eliminarAdministrador(a.id)"
                title="Eliminar administrador"
              >
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="administradores.length === 0">
          <td colspan="6" class="text-center py-4 text-muted fst-italic">
            <i class="bi bi-shield-exclamation me-2"></i> No hay administradores registrados en el sistema.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
