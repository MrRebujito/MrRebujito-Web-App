<div class="container mt-4">
  <div class="card shadow-none">
    <div class="card-header">
      <h3>{{ id == null ? 'Registro de Administrador' : 'Editar Administrador' }}</h3>
    </div>

    <div class="card-body">
      <form [formGroup]="formularioAdmin" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4 mb-4">
            <label class="form-label">Nombre *</label>
            <input
              type="text"
              formControlName="nombre"
              class="form-control"
              [class.is-invalid]="esInvalido('nombre')"
            />
          </div>

          <div class="col-md-4 mb-4">
            <label class="form-label">Primer Apellido *</label>
            <input
              type="text"
              formControlName="primerApellido"
              class="form-control"
              [class.is-invalid]="esInvalido('primerApellido')"
            />
          </div>

          <div class="col-md-4 mb-4">
            <label class="form-label">Segundo Apellido</label>
            <input type="text" formControlName="segundoApellido" class="form-control" />
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-4">
            <label class="form-label">Correo Electrónico *</label>
            <input
              type="email"
              formControlName="correo"
              class="form-control"
              [class.is-invalid]="esInvalido('correo')"
            />
            <div class="invalid-feedback">Debe introducir un email válido.</div>
          </div>

          <div class="col-md-6 mb-4">
            <label class="form-label">Teléfono *</label>
            <input
              type="text"
              formControlName="telefono"
              class="form-control"
              [class.is-invalid]="esInvalido('telefono')"
              placeholder="9 dígitos"
            />
            <div class="invalid-feedback">Formato de teléfono no válido.</div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12 mb-4">
            <label class="form-label">URL de la Foto</label>
            <input
              type="text"
              formControlName="foto"
              class="form-control"
              [class.is-invalid]="esInvalido('foto')"
              placeholder="https://ejemplo.com/mi-foto.jpg"
            />
            <div class="invalid-feedback">Debe ser una URL válida.</div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-4">
            <label class="form-label">Nombre de Usuario *</label>
            <input
              type="text"
              formControlName="username"
              class="form-control"
              [class.is-invalid]="esInvalido('username')"
            />
          </div>

          <div class="col-md-6 mb-4" *ngIf="id == null">
            <label class="form-label">Contraseña *</label>
            <input
              type="password"
              formControlName="password"
              class="form-control"
              [class.is-invalid]="esInvalido('password')"
            />
            <div class="invalid-feedback">Mínimo 6 caracteres.</div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Dirección (Opcional)</label>
          <input type="text" formControlName="direccion" class="form-control" />
        </div>

        <div class="text-end mt-5">
          <button
            type="button"
            class="btn btn-secondary me-3"
            (click)="router.navigate(['/administradores'])"
          >
            Cancelar
          </button>
          <button type="submit" class="btn btn-success" [disabled]="formularioAdmin.invalid">
            {{ id == null ? 'Registrar Administrador' : 'Guardar Cambios' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
