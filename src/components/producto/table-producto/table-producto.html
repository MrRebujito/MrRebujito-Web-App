<div class="container mt-5">
  
  <div class="row mb-4 align-items-center">
    <div class="col-md-8">
      <h2 class="titulo-seccion">Gestión de Productos</h2>
    </div>
    <div class="col-md-4 text-end">
      <button class="btn btn-success" (click)="crearProducto()">
        <i class="bi bi-plus-circle me-2"></i>Nuevo Producto
      </button>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-0 align-middle">
          <thead class="table-dark">
            <tr>
              <th scope="col" class="text-center">ID</th>
              <th scope="col">Nombre</th>
              <th scope="col" class="text-center">Tipo</th>
              <th scope="col" class="text-end">Precio</th>
              <th scope="col" class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            
            <tr *ngFor="let producto of productos">
              <td class="text-center fw-bold">{{ producto.id }}</td>
              <td>{{ producto.nombre }}</td>
              <td class="text-center">
                <span class="badge" 
                      [ngClass]="{
                        'bg-success': producto.tipoAlimento === 'COMIDA',
                        'bg-info text-dark': producto.tipoAlimento === 'BEBIDA'
                      }">
                  {{ producto.tipoAlimento }}
                </span>
              </td>
              <td class="text-end fw-bold">{{ producto.precio | number:'1.2-2' }} €</td>
              
              <td class="text-center">
                <div class="btn-group" role="group">
                  <button class="btn btn-sm btn-info" 
                          [routerLink]="['/producto/edit', producto.id]" 
                          title="Editar">
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  
                  <button class="btn btn-sm btn-warning" 
                          (click)="borrarProducto(producto.id)" 
                          title="Eliminar">
                    <i class="bi bi-trash-fill"></i>
                  </button>
                </div>
              </td>
            </tr>

            <tr *ngIf="productos.length === 0">
              <td colspan="5" class="text-center py-5 text-muted">
                <i class="bi bi-box-seam display-4 d-block mb-3"></i>
                No hay productos disponibles.
              </td>
            </tr>

          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
