<div class="container mt-5">
  <div class="row mb-4 align-items-center">
    <div class="col-md-8">
      <h2 class="titulo-seccion">Gestión de Productos</h2>
    </div>
    <div class="col-md-4 text-end">
      <button class="btn btn-primary-mr" (click)="crearProducto()">
        <i class="bi bi-plus-circle me-2"></i>Nuevo Producto
      </button>
    </div>
  </div>

  <div class="card filter-card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-5">
          <label class="form-label">Buscar Producto</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control"
              placeholder="Nombre del producto..."
              [(ngModel)]="filtroNombre"
              (input)="aplicarFiltros()"
            />
          </div>
        </div>

        <div class="col-md-3">
          <label class="form-label">Categoría</label>
          <select class="form-select" [(ngModel)]="filtroTipo" (change)="aplicarFiltros()">
            <option value="">Todas las Categorías</option>
            <option value="COMIDA">Comida</option>
            <option value="BEBIDA">Bebida</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Precio Máximo</label>
          <div class="input-group">
            <span class="input-group-text">€</span>
            <input
              type="number"
              class="form-control"
              placeholder="0.00"
              [(ngModel)]="filtroPrecio"
              (input)="aplicarFiltros()"
            />
          </div>
        </div>

        <div class="col-md-1 d-grid">
          <button class="btn btn-secondary-mr" (click)="limpiarFiltros()" title="Limpiar filtros">
            <i class="bi bi-eraser"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="table-responsive shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead>
        <tr>
          <th scope="col" class="text-center">ID</th>
          <th scope="col">Nombre</th>
          <th scope="col" class="text-center">Stock</th>
          <th scope="col" class="text-center">Tipo</th>
          <th scope="col" class="text-end">Precio</th>
          <th scope="col" class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let producto of productosFiltrados" class="fade-in-row">
          <td class="text-center fw-bold text-muted small">{{ producto.id }}</td>
          <td class="fw-medium">{{ producto.nombre }}</td>

          <td class="text-center">
            <span
              class="badge"
              [ngClass]="{
                'bg-stock-empty': producto.stock === 0,
                'bg-stock-low': producto.stock > 0 && producto.stock < 10,
                'bg-stock-ok': producto.stock >= 10,
              }"
            >
              {{ producto.stock }} u.
            </span>
          </td>

          <td class="text-center">
            <span
              class="badge"
              [ngClass]="{
                'bg-tipo-comida': producto.tipoAlimento === 'COMIDA',
                'bg-tipo-bebida': producto.tipoAlimento === 'BEBIDA',
              }"
            >
              {{ producto.tipoAlimento }}
            </span>
          </td>

          <td class="text-end fw-bold text-precio">{{ producto.precio | number: '1.2-2' }} €</td>

          <td class="text-center">
            <div class="btn-group">
              <button
                class="btn btn-sm btn-view"
                [routerLink]="['/producto/detail', producto.id]"
                title="Ver Detalle"
              >
                <i class="bi bi-eye"></i>
              </button>
              <button
                class="btn btn-sm btn-edit"
                [routerLink]="['/producto/edit', producto.id]"
                title="Editar"
              >
                <i class="bi bi-pencil-square"></i>
              </button>
              <button
                class="btn btn-sm btn-delete"
                (click)="borrarProducto(producto.id)"
                title="Eliminar"
              >
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>

        <tr *ngIf="productosFiltrados.length === 0">
          <td colspan="6" class="text-center py-5 text-muted">
            <div class="empty-state">
              <i class="bi bi-search display-4 d-block mb-3 opacity-25"></i>
              <p>No se han encontrado productos con estos filtros.</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
