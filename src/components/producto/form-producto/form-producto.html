<div class="container mt-4">
  <div class="card shadow-lg glass-card">
    
    <div class="card-header text-white" 
         [ngClass]="id ? 'bg-info' : 'bg-success'">
      <h3 class="mb-0 fw-bold">
        <i class="bi" [ngClass]="id ? 'bi-pencil-square' : 'bi-plus-circle'"></i>
        {{ id ? 'Editar Producto' : 'Nuevo Producto' }}
      </h3>
    </div>

    <div class="card-body p-4">
      <form [formGroup]="formularioProducto" (ngSubmit)="onSubmit()">
        
        <h5 class="border-bottom pb-2 mb-4 text-muted">Información General</h5>
        
        <div class="row">
          
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Nombre del Producto *</label>
            <input
              type="text"
              formControlName="nombre"
              class="form-control form-control-lg"
              placeholder="Ej: Plato de Jamón"
              [ngClass]="{
                'is-invalid': formularioProducto.get('nombre')?.invalid && formularioProducto.get('nombre')?.touched
              }"
            />
            <div class="invalid-feedback">
              El nombre es obligatorio y debe tener al menos 3 caracteres.
            </div>
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label fw-bold">Precio (€) *</label>
            <div class="input-group">
              <input
                type="number"
                step="0.01"
                min="0"
                formControlName="precio"
                class="form-control form-control-lg"
                placeholder="0.00"
                [ngClass]="{
                  'is-invalid': formularioProducto.get('precio')?.invalid && formularioProducto.get('precio')?.touched
                }"
              />
              <span class="input-group-text">€</span>
              <div class="invalid-feedback">
                Introduce un precio válido mayor a 0.
              </div>
            </div>
          </div>

          <div class="col-md-3 mb-3">
            <label class="form-label fw-bold">Categoría *</label>
            <select
              formControlName="tipoAlimento"
              class="form-select form-select-lg"
              [ngClass]="{
                'is-invalid': formularioProducto.get('tipoAlimento')?.invalid && formularioProducto.get('tipoAlimento')?.touched
              }"
            >
              <option *ngFor="let tipo of tiposAlimento" [value]="tipo">
                {{ tipo }}
              </option>
            </select>
            <div class="invalid-feedback">
              Selecciona una categoría.
            </div>
          </div>

        </div>

        <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
          
          <button type="button" class="btn btn-outline-secondary px-4" routerLink="/productos">
            Cancelar
          </button>

          <button 
            type="submit" 
            class="btn px-4 text-white"
            [ngClass]="id ? 'btn-info' : 'btn-success'"
            [disabled]="formularioProducto.invalid">
            <i class="bi bi-save me-2"></i>
            {{ id ? 'Guardar Cambios' : 'Crear Producto' }}
          </button>

        </div>

      </form>
    </div>
  </div>
</div>
