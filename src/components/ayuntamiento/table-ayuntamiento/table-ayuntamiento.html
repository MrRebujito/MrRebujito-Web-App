<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Listado de Ayuntamientos</h2>

    <button
      *ngIf="esAdmin()"
      class="btn btn-success"
      routerLink="/ayuntamientos/form"
      title="Crear Nuevo Ayuntamiento"
    >
      <span style="font-size: 1.8rem; line-height: 0; margin-bottom: 4px">+</span>
      <img src="assets-webp/ayuntamiento.webp" alt="Icono Ayto" style="height: 35px; width: auto" />
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover table-bordered">
      <thead class="table-dark text-center">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Nombre</th>
          <th scope="col">Dirección</th>
          <th scope="col">Contacto</th>
          <th scope="col">Nº de licencias</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let a of ayuntamientos">
          <td class="text-center align-middle">{{ a.id }}</td>
          <td class="align-middle">{{ a.nombre }}</td>
          <td class="align-middle">{{ a.direccion }}</td>
          <td class="align-middle">
            <div><i class="bi bi-envelope"></i> {{ a.correo }}</div>
            <div><i class="bi bi-telephone"></i> {{ a.telefono }}</div>
          </td>
          <td class="text-center align-middle">{{ a.licenciaMax }}</td>
          <td class="text-center align-middle">
            <div class="btn-group">
              <button
                class="btn btn-info btn-sm text-white"
                [routerLink]="['/ayuntamientos', a.id]"
                title="Ver detalles"
              >
                <i class="bi bi-eye"></i>
              </button>
              <button
                *ngIf="esAdmin()"
                class="btn btn-warning btn-sm"
                [routerLink]="['/ayuntamientos/form', a.id]"
                title="Editar"
              >
                <i class="bi bi-pencil"></i>
              </button>

              <button
                *ngIf="esAdmin()"
                class="btn btn-danger btn-sm"
                (click)="borrar(a.id)"
                title="Eliminar"
              >
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
